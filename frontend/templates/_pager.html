{% if pages > 1 %}
<div class="pager">
    {% if page > 1 %}<a class="btn-small" href="{{ url_for(pager_endpoint, page=page - 1, **filters) }}">Previous</a>{% else %}<span></span>{% endif %}
    <span>Page {{ page }} of {{ pages }}</span>
    {% if page < pages %}<a class="btn-small" href="{{ url_for(pager_endpoint, page=page + 1, **filters) }}">Next</a>{% else %}<span></span>{% endif %}
</div>
{% endif %}
