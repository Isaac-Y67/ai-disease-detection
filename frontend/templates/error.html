<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — AI Disease Detection System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <span class="module-badge">Error {{ code }}</span>
        <h1>{{ title }}</h1>
        <p class="header-sub">{{ message }}</p>
    </div>
</header>

<main class="login-layout">
    <div class="form-panel login-card">
        <a class="submit-btn error-link" href="{{ url_for('home') }}">Back to my home page</a>
    </div>
</main>

<footer class="site-footer">
    <p>Decision-support output only &mdash; always to be reviewed by a qualified healthcare professional.</p>
</footer>

</body>
</html>
